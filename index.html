<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07070f">
  <title>Oracle AI — Football</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <div class="grain"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2.6 21.4 12 12 21.4 2.6 12 12 2.6Z" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3.1"/>
          </svg>
          <span class="logo-glow"></span>
        </span>
        <div class="brand-text">
          <h1>Oracle<span>AI</span></h1>
          <p>Football intelligence</p>
        </div>
      </div>
      <button id="refresh" class="icon-btn" aria-label="Обновить">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/>
        </svg>
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="live" aria-selected="true"><i class="dot"></i> Live</button>
      <button class="tab" role="tab" data-tab="today" aria-selected="false">Сегодня</button>
      <button class="tab" role="tab" data-tab="upcoming" aria-selected="false">Скоро</button>
    </nav>

    <div class="controls">
      <div class="search-box">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Поиск команды (RU/EN)..." autocomplete="off">
      </div>
      <select id="sort-select" class="sort-box">
        <option value="priority">🔥 Топ-лиги</option>
        <option value="time">🕒 По времени</option>
      </select>
    </div>

    <main id="list" class="list"></main>

    <footer class="footer">
      <span>Powered by <a href="https://sports.bzzoiro.com" target="_blank">Bzzoiro Sports</a></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
