<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07070f">
  <meta name="color-scheme" content="dark light">
  <title>Oracle AI — Football</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ───── Aurora background ───── -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <div class="grain"></div>
  </div>

  <!-- ───── App ───── -->
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg class="ic"><use href="#i-logo"/></svg>
          <span class="logo-glow"></span>
        </span>
        <div class="brand-text">
          <h1>Oracle<span>AI</span></h1>
          <p>Football intelligence</p>
        </div>
      </div>

      <button id="refresh" class="icon-btn" aria-label="Обновить данные">
        <svg class="ic"><use href="#i-refresh"/></svg>
      </button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Фильтр матчей">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="live" aria-selected="true">
        <i class="dot" aria-hidden="true"></i> Live
      </button>
      <button class="tab" role="tab" data-tab="today" aria-selected="false">Сегодня</button>
      <button class="tab" role="tab" data-tab="upcoming" aria-selected="false">Скоро</button>
    </nav>

    <main id="list" class="list" aria-live="polite" aria-busy="false"></main>

    <footer class="footer">
      <span>Powered by <a href="https://sportscore.com" target="_blank" rel="noopener">SportScore</a></span>
    </footer>
  </div>

  <!-- ───── SVG sprite ───── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M12 2.6 21.4 12 12 21.4 2.6 12 12 2.6Z" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3.1"/>
    </symbol>

    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/>
      <path d="M20.5 3.5V9H15"/>
    </symbol>

    <symbol id="i-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7.4 15.9 10.3 14.4 14.9H9.6L8.1 10.3 12 7.4Z"/>
      <path d="M12 3v4.4M20.6 9.4l-4.7.9M18.6 20l-3.4-5.1M5.4 20l3.4-5.1M3.4 9.4l4.7.9"/>
    </symbol>

    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2 21.8 20H2.2L12 3.2Z"/>
      <path d="M12 9.4v4.8"/>
      <circle cx="12" cy="17.2" r=".7" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
